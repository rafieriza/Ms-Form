<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>AutoSubmit Ms Form</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h2>AutoSubmit Ms Form</h2>
    
    <!-- TAB 1: HOME (Input Jadwal) -->
    <div id="homeView" class="view-section">
      <div class="form-group">
        <label>Name</label>
        <input type="text" id="formName" placeholder="Masukkan nama tugas">
      </div>

      <div class="form-group">
        <label>Form Link</label>
        <input type="text" id="formUrl" placeholder="https://forms.cloud.microsoft/...">
      </div>

      <!-- Pilihan Project Autofill -->
      <div class="form-group">
        <label>Autofill Project (Opsional)</label>
        <select id="selectedProject">
          <option value="">-- Tanpa Autofill (Manual) --</option>
        </select>
      </div>

      <div class="form-group">
        <label>Start Time</label>
        <input type="datetime-local" id="startTime">
      </div>

      <div class="form-group">
        <label>End Time</label>
        <input type="datetime-local" id="endTime">
      </div>

      <div class="action-buttons">
        <button id="submitBtn" class="btn-primary">SUBMIT</button>
        <button id="resetBtn" class="btn-secondary">RESET</button>
      </div>
    </div>

    <!-- TAB 2: PROJECTS (Katalog & Editor Autofill) -->
    <div id="projectsView" class="view-section" style="display: none;">
      <!-- Sub-view A: List Project -->
      <div id="projectListView">
        <button id="newProjectBtn" class="btn-primary" style="margin-bottom: 10px; width: 100%;">+ Buat Project Baru</button>
        <div id="projectList" class="list-container">
          <p class="no-data">Belum ada project autofill.</p>
        </div>
      </div>

      <!-- Sub-view B: Editor Rules Project -->
      <div id="projectEditorView" style="display: none;">
        <button id="backToProjectsBtn" class="btn-secondary" style="padding: 4px 8px; font-size: 11px; margin-bottom: 10px;">&larr; Kembali</button>
        <div class="form-group">
          <label>Nama Project</label>
          <input type="text" id="editProjectName" readonly style="background-color: #eee;">
        </div>
        <div class="form-group">
          <label>Aturan Isian (Rules)</label>
          <div id="rulesContainer">
            <!-- Dynamic Rules (Text, Choice, Date) akan dirender secara dinamis di sini oleh JS -->
          </div>
          <button id="addRuleBtn" class="btn-secondary" style="margin-top: 5px; width: 100%; font-size: 11px;">+ Tambah Rule</button>
        </div>
        <button id="saveProjectBtn" class="btn-primary" style="width: 100%; margin-top: 10px;">SIMPAN PROJECT</button>
      </div>
    </div>

    <!-- TAB 3: ALARMS (Daftar Tugas Aktif) -->
    <div id="alarmsView" class="view-section" style="display: none;">
      <div id="alarmsList" class="list-container">
        <p class="no-data">Belum ada alarm tersimpan.</p>
      </div>
    </div>

    <!-- Navigasi Bawah 3 Menu (Home, Projects, Alarms) -->
    <div class="footer-nav">
      <div class="nav-item active" id="navHome">
        <span>🏠</span>
        <p>Home</p>
      </div>
      <div class="nav-item" id="navProjects">
        <span>📁</span>
        <p>Projects</p>
      </div>
      <div class="nav-item" id="navAlarms">
        <span>⏰</span>
        <p>Alarms</p>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
